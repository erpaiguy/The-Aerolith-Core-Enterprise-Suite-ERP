name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub refuses anonymous pulls from busy runners; Google's public mirror of it does not.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aerolith_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_CONTROL_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/aerolith_test
      TEST_LOCAL_PG_ADMIN_URL: postgres://ci:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: File names that differ only in case (Windows sees one file)
        run: pnpm case:check
      - name: Licence gate (docs/licensing-policy.md)
        run: pnpm licenses:check

  e2e:
    # The first-run journey in a real browser against the real API and databases (docs/app-shells.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub refuses anonymous pulls from busy runners; Google's public mirror of it does not.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_PG_ADMIN_URL: postgres://ci:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        # No --with-deps: the runner image already has Chromium's system libraries, and the apt step is where
        # installs tend to hang. Fail fast instead of eating the job timeout.
        timeout-minutes: 5
        run: pnpm --filter @aerolith/e2e exec playwright install chromium
      - name: Browser end-to-end
        run: pnpm --filter @aerolith/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/test-results
          retention-days: 7

  docker-stack:
    # Builds the owner-PC Docker images, starts the stack and runs the same journey through Caddy (docs/deployment-docker.md).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose --env-file deploy/.env -f deploy/docker-compose.yml
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_OWNER_URL: http://127.0.0.1:8081
      E2E_OPERATOR_CMD: docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T api node dist/cli/create-operator.js
      E2E_MAIL_DIR: /tmp/aerolith-mail
      # Docker Hub refuses anonymous pulls from busy runners; the stack takes the same official images from Google's
      # public mirror of it. The deploy files default to Docker Hub.
      POSTGRES_IMAGE: mirror.gcr.io/library/postgres:16-alpine
      NODE_IMAGE: mirror.gcr.io/library/node:22-bookworm-slim
      CADDY_IMAGE: mirror.gcr.io/library/caddy:2-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate deploy/.env
        run: bash deploy/scripts/init-env.sh
      - name: Build and start the stack
        run: |
          mkdir -p "$E2E_MAIL_DIR" && chmod 777 "$E2E_MAIL_DIR"
          $COMPOSE -f deploy/docker-compose.e2e.yml up -d --build --wait
      - name: Owner console and routes are not public
        run: |
          curl -fsS http://127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/owner/tenants)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/owner/tenants)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/auth/login)" = 404
          curl -fsS http://127.0.0.1:8081/ | grep -q '<title>Aerolith Owner Console</title>'
          ! curl -fsS http://127.0.0.1:8080/ | grep -q 'Owner Console'
      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: pnpm --filter @aerolith/e2e exec playwright install chromium
      - name: Browser end-to-end against the stack
        env:
          E2E_OPERATOR_CWD: ${{ github.workspace }}
        run: pnpm --filter @aerolith/e2e e2e
      - if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-stack-e2e-results
          path: tests/e2e/test-results
          retention-days: 7

  desktop-windows:
    # Proves the Windows installer packages. Unsigned until code signing is set up (docs/10-deployment.md §10).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aerolith/web --filter @aerolith/shared --filter @aerolith/desktop build
      - name: Desktop app configuration
        shell: bash
        run: echo '{"apiBaseUrl":"${{ vars.DESKTOP_API_BASE_URL || 'https://api.example.invalid' }}"}' > apps/desktop/resources/app-config.json
      - name: Build Windows installer
        run: pnpm --filter @aerolith/desktop dist:win
      # The installer is ~100 MB: kept from main only, briefly, so branch pushes do not fill the artifact quota.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: windows-installer-unsigned
          path: apps/desktop/release/*.exe
          retention-days: 3
