# Windows-only at trial launch (docs/10-deployment.md §10). Code signing is configured in CI through
# electron-builder's environment variables; nothing secret lives in this file.
appId: in.aerolith.core
productName: Aerolith Core
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: resources/app-config.json
    to: app-config.json
  # Third-party licences and SBOM of everything in the installer (docs/licensing-policy.md §3.2); the web bundle's own
  # copy is shown in the app. Electron's and Chromium's licence files are added by electron-builder itself.
  - from: notices
    to: .
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: AerolithCore-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
